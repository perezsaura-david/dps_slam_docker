# Simulation overrides (launcher.sh -s), on top of the sslam_tools package configs.
# Values per drift bag: 41cm = _tfdrift, 1m = _tfdrift_1m, 2m = _tfdrift_2m (2m values untuned).

/odom_covariance_node:
  ros__parameters:
    input_topic: "/odom"
    output_topic: "/odom_cov"
    # covariance for position output to graph optimization, per keyframe (41cm: 0.03 / 1m: 0.07 / 2m: 0.14 / real: 0.01)
    position_std_m: 0.14
    # covariance for attitude output to graph optimization, per keyframe (41cm: 0.2 / 1m: 0.5 / 2m: 1.0 / real: 0.0057)
    attitude_std_deg: 1.0
    # start anchor: tight position covariance for the first N m flown, 0 disables (5.0)
    anchor_distance_m: 5.0

/global_fusion_node:
  ros__parameters:
    # turn filter: skip frames above this yaw rate (sim: 20 / real: 45)
    max_yaw_rate_deg_s: 20.0
    # turn filter: keep skipping this long after a fast turn (0.5)
    yaw_rate_settle_sec: 0.5
    # revisit gate widening per m since last match (41cm: 1.5 / 1m: 3.5 / 2m: 7.0)
    revisit_dist_per_m_cm: 7.0
    # revisit angle gate widening per m since last match (41cm: 0.1 / 1m: 0.25 / 2m: 0.5)
    revisit_angle_per_m_deg: 0.5
    # revisit distance widening cap (41cm: 30 / 1m: 80 / 2m: 150)
    revisit_max_extra_dist_cm: 150.0
    # revisit angle widening cap (41cm: 5 / 1m: 10 / 2m: 20)
    revisit_max_extra_angle_deg: 20.0
    # combined cost gate, d/dist + a/angle (package: 0.8 / sim: 2.0)
    gate_threshold: 2.0
    # association angle gate (package: 5 / sim, real: 8)
    match_angle_thresh_deg: 8.0
    # association distance gate (package, real: 20 / sim: 30)
    match_dist_thresh: 30.0
    # association along-wall gap (sim: 10 / real: 30)
    overlap_thresh: 10.0
    # ambiguity: drop an observation if 2nd-best cost < ratio * best, 0 disables (2.0)
    ambiguity_cost_ratio: 2.0
