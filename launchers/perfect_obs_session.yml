name: a2rl
root: ./
startup_window: slam
pre_window: |
  source /opt/ros/humble/setup.bash
  source /root/workspace/install/setup.bash
  export NAMESPACE=drone0;
  export ROSBAG_FILE=/root/rosbags/rosbag2_non_repetitive_livox_2026_06_20-09_12_42_realistic_tfdrift/
  export ROSBAG_RATE=0.5;
  export CONFIG_FILE=/root/launchers/config_struct.yaml
  export USE_SIM_TIME=true
  # --tilt-aware: walls in the full 3D body frame; empty: 2D model of the real pipeline
  export PERFECT_OBS_ARGS=--tilt-aware
  export LOG_DIR=/root/content/launchers/logs
  export LOG_STAMP=$(date +%Y%m%d_%H%M%S)
  mkdir -p $LOG_DIR
windows:
  - slam:
      layout: tiled
      panes:
        - stdbuf -oL -eL ros2 launch dps_slam dps_slam.launch.py namespace:=$NAMESPACE use_sim_time:=$USE_SIM_TIME config_file:=$CONFIG_FILE 2>&1 | tee $LOG_DIR/dps_slam_$LOG_STAMP.log
        - ros2 run tf2_ros static_transform_publisher --x 0 --y 0 --z 0 --roll 0 --pitch 0 --yaw 0.0 --frame-id drone0/base_link --child-frame-id livox_frame --ros-args -p use_sim_time:=$USE_SIM_TIME
  - detections:
      layout: tiled
      panes:
        # Perfect observations from ground truth instead of the detection pipeline, to
        # test the SLAM backend in isolation (see publish_perfect_wall_observations.py).
        - python3 /root/workspace/scripts/publish_perfect_wall_observations.py $PERFECT_OBS_ARGS --ros-args -p use_sim_time:=$USE_SIM_TIME
  - rosbag:
      layout: tiled
      panes:
        - ros2 bag play $ROSBAG_FILE --start-offset 0.0 -r $ROSBAG_RATE
        - rviz2 -d ./rviz.rviz --ros-args -p use_sim_time:=$USE_SIM_TIME
        - python3 /root/workspace/scripts/publish_grid_gt_markers.py --ros-args -p use_sim_time:=$USE_SIM_TIME
  - metrics:
      layout: tiled
      panes:
        - python3 /root/workspace/scripts/evaluate_trajectory_error.py --label slam --ros-args -p use_sim_time:=$USE_SIM_TIME
        - python3 /root/workspace/scripts/evaluate_trajectory_error.py --corrected-topic /odom --msg-type odometry --label lio --ros-args -p use_sim_time:=$USE_SIM_TIME
        - python3 /root/workspace/scripts/publish_raw_odom_path.py --ros-args -p use_sim_time:=$USE_SIM_TIME
        - python3 /root/workspace/scripts/compare_tf_pose_to_ground_truth.py --ros-args -p use_sim_time:=$USE_SIM_TIME
