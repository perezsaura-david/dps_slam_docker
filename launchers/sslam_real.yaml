# Overrides for real-flight bags (FAST-LIO + Livox Mid-360), loaded by `launcher.sh -r` on top of
# the sslam_tools package configs through divided_launch.py's extra_params_file argument.
# Only what differs from the simulation defaults goes here.

/converter:
  ros__parameters:
    # The driver publishes livox_ros_driver2/CustomMsg in ~100 Hz packets; 10 make one 10 Hz scan.
    input_type: "custom_msg"
    accumulate_packets: 10

/global_fusion_node:
  ros__parameters:
    map_frame: 'map'
    # Looser than the simulation-calibrated 2 cm + 0.5 cm/m / 1.5 deg: real returns are noisier
    # and walls less ideal, and there is no ground truth here to calibrate against.
    obs_dist_std_cm: 3.0
    obs_dist_std_per_m_cm: 1.0
    obs_angle_std_deg: 3.0
    # Skip frames taken while turning faster than this: at the tunnel-end 180 deg turn
    # (up to ~150 deg/s) wall angles were off by 4-8 deg (>60 deg/s), yanking the yaw.
    max_yaw_rate_deg_s: 45.0
    # ...and for 0.5 s after: right after a 90 deg turn at the right junction the first frames
    # (38 -> 12 deg/s) still had every wall 1.2-3 deg off the same way, pulling yaw +1.8 deg.
    yaw_rate_settle_sec: 0.5
