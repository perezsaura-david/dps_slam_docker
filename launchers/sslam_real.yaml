# Overrides for real-flight bags (FAST-LIO + Livox Mid-360), loaded by `launcher.sh -r` on top of
# the sslam_tools package configs through divided_launch.py's extra_params_file argument.
# Only what differs from the simulation defaults goes here.

/converter:
  ros__parameters:
    # The driver publishes livox_ros_driver2/CustomMsg in ~100 Hz packets; 10 make one 10 Hz scan.
    input_type: "custom_msg"
    accumulate_packets: 10

/detector_node:
  ros__parameters:
    # Shift of the scan stamps onto the odometry time base. Cross-correlating the IMU gyro with the
    # /odom attitude suggests /odom is ~20 ms late, but +32 ms made results worse (partly because
    # the TF lookups then ran ahead of dps_slam's map->odom), so it stays off until measured cleanly.
    stamp_offset_sec: 0.0
    # Debug images off in all three nodes: rendering costs CPU the pipeline needs (drawing the
    # global map every frame made global_fusion drop ~25% of its frames). Turn back on to debug.
    capture_inference_image: false

/local_fusion_node:
  ros__parameters:
    publish_img_flag: false

/global_fusion_node:
  ros__parameters:
    map_frame: 'map'
    publish_img_flag: false
    # If the map image is turned back on, draw it at most once per second.
    image_period_sec: 1.0
    # Measured on mazmorra_full_correct (3 runs, 8348 observations, residual vs each id's median
    # line with the FAST-LIO pose): robust std 2.3-2.6 cm at 1-3 m, 4.3 cm at 3-5 m, 6.9 cm under
    # 1 m; angle 0.67 deg at every range. The ~10% heavy tail (> 10-19 cm) is not modelled here.
    obs_dist_std_cm: 5.0
    obs_dist_std_per_m_cm: 0.0
    obs_angle_std_deg: 1.0
    # Association (merge) gates. Real flights split one wall into several ids, so angle and
    # along-wall gap are looser than the package's 5 deg / 10 cm (3 runs each: ~95 -> ~70 ids,
    # max error vs LIO 11-14 -> 13-19 cm). Distance stays at 20 cm: at 30 cm, parallel lines
    # ~0.2 m apart were merged into one wall across junctions (~60 ids but max error 22-30 cm).
    match_dist_thresh: 20.0
    match_angle_thresh_deg: 8.0
    overlap_thresh: 30.0
    # Skip frames taken while turning faster than this: at the tunnel-end 180 deg turn
    # (up to ~150 deg/s) wall angles were off by 4-8 deg (>60 deg/s), yanking the yaw.
    max_yaw_rate_deg_s: 45.0
    # ...and for 0.5 s after: right after a 90 deg turn at the right junction the first frames
    # (38 -> 12 deg/s) still had every wall 1.2-3 deg off the same way, pulling yaw +1.8 deg.
    yaw_rate_settle_sec: 0.5

/odom_covariance_node:
  ros__parameters:
    # Odometry weight in dps_slam, set here next to the wall observation covariance above
    # (global_fusion_node) so the two are tuned together. dps_slam reads /odom_cov as is.
    # Attitude: ~1e-8 rad^2 per keyframe, i.e. trust FAST-LIO's heading outright (the graph used to
    # bend it by 2-4 deg, >10 cm off far from the origin); walls then correct position only.
    input_topic: "/odom"
    output_topic: "/odom_cov"
    position_std_m: 0.01
    attitude_std_deg: 0.0057
