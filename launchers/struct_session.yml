<%# Mode comes from launcher.sh (-s sim, default / -r real) as `tmuxinator start -p ... mode=real` %>
<% real = @settings["mode"] == "real" %>
name: a2rl
root: ./
startup_window: slam
pre_window: |
  source /opt/ros/humble/setup.bash
  source /root/workspace/install/setup.bash
  export NAMESPACE=drone0;
<% if real %>
  # Real flight (FAST-LIO odometry, Livox CustomMsg): frames are not namespaced, the bag has
  # no /clock and no ground truth. _fix_clean = _fix (record times = header stamps, which
  # --clock needs) with FAST-LIO's map->odom removed from /tf (dps_slam publishes it).
  export ROSBAG_FILE=/root/rosbags/2026_06_24_mazamorra_odometry/mazmorra_full_correct-01_18_01_fix_clean
  export FRAME_PREFIX=
  # 1000 Hz: dps_slam stamps map->odom with now(); at the default 40 Hz /clock it lags the scan
  # stamps by up to 25 ms and global_fusion drops those frames (TF extrapolation into the future).
  export CLOCK_ARG="--clock 1000"
  export SSLAM_EXTRA_PARAMS=/root/launchers/sslam_real.yaml
  # dps_slam takes /odom_cov as is: odom_covariance_node (sslam_real.yaml) sets its covariance,
  # tiny in attitude so FAST-LIO keeps the heading and walls only correct position. The floor must
  # sit below that covariance. Walls come from 2D lines, so their planes must stay vertical.
  export DPS_EXTRA_ARGS="odometry_topic:=/odom_cov calculate_odom_covariance:=false odom_covariance_floor:=0.000000001 wall_vertical_prior_std_deg:=0.5"
  # No ground truth: no GT path / GT walls, and paths named for what they are.
  export RVIZ_CONFIG=./rviz_real.rviz
<% else %>
  # Simulation: namespaced drone0/* TF tree; the bag carries its own /clock (publishing
  # another one collides with it) and ground truth.
  # Drift variants (LIO error at the end): _tfdrift 41 cm, _tfdrift_1m 1.0 m, _tfdrift_2m 2.0 m.
  export ROSBAG_FILE=/root/rosbags/rosbag2_non_repetitive_livox_2026_06_20-09_12_42_realistic_tfdrift_1m/
  export FRAME_PREFIX=drone0/
  export CLOCK_ARG=
  # Odometry covariance set by odom_covariance_node (sslam_sim.yaml), as in real flights.
  export SSLAM_EXTRA_PARAMS=/root/launchers/sslam_sim.yaml
  export DPS_EXTRA_ARGS="odometry_topic:=/odom_cov calculate_odom_covariance:=false odom_covariance_floor:=0.000000001"
  export RVIZ_CONFIG=./rviz.rviz
<% end %>
  export ROSBAG_RATE=0.5;
  export CONFIG_FILE=/root/launchers/config_struct.yaml
  export USE_SIM_TIME=true
  export LOG_DIR=/root/content/launchers/logs
  export LOG_STAMP=$(date +%Y%m%d_%H%M%S)
  mkdir -p $LOG_DIR
windows:
  - slam:
      layout: tiled
      panes:
        - stdbuf -oL -eL ros2 launch dps_slam dps_slam.launch.py namespace:=$NAMESPACE use_sim_time:=$USE_SIM_TIME config_file:=$CONFIG_FILE map_frame:=${FRAME_PREFIX}map odom_frame:=${FRAME_PREFIX}odom robot_frame:=${FRAME_PREFIX}base_link $DPS_EXTRA_ARGS 2>&1 | tee $LOG_DIR/dps_slam_$LOG_STAMP.log
        - ros2 run tf2_ros static_transform_publisher --x 0 --y 0 --z 0 --roll 0 --pitch 0 --yaw 0.0 --frame-id ${FRAME_PREFIX}base_link --child-frame-id livox_frame --ros-args -p use_sim_time:=$USE_SIM_TIME
  - detections:
      layout: tiled
      panes:
        - ros2 launch sslam_tools divided_launch.py use_sim_time:=$USE_SIM_TIME ${SSLAM_EXTRA_PARAMS:+extra_params_file:=$SSLAM_EXTRA_PARAMS}
  - rosbag:
      layout: tiled
      panes:
        # Default read-ahead (1000 msgs, ~1-2 s of these bags) underruns and stalls playback
        # (and /clock), dropping frames whose TF then never arrives in time.
        - ros2 bag play $ROSBAG_FILE $CLOCK_ARG --read-ahead-queue-size 20000 --start-offset 0.0 -r $ROSBAG_RATE
        - rviz2 -d $RVIZ_CONFIG --ros-args -p use_sim_time:=$USE_SIM_TIME
<% if real %>
        - python3 /root/workspace/scripts/publish_raw_odom_path.py --ros-args -p use_sim_time:=$USE_SIM_TIME
<% else %>
        - python3 /root/workspace/scripts/publish_grid_gt_markers.py --ros-args -p use_sim_time:=$USE_SIM_TIME
  # Ground-truth metrics exist only in simulation.
  - metrics:
      layout: tiled
      panes:
        - python3 /root/workspace/scripts/evaluate_trajectory_error.py --label slam --ros-args -p use_sim_time:=$USE_SIM_TIME
        - python3 /root/workspace/scripts/evaluate_trajectory_error.py --corrected-topic /odom --msg-type odometry --label lio --ros-args -p use_sim_time:=$USE_SIM_TIME
        - python3 /root/workspace/scripts/publish_raw_odom_path.py --ros-args -p use_sim_time:=$USE_SIM_TIME
        - python3 /root/workspace/scripts/compare_tf_pose_to_ground_truth.py --ros-args -p use_sim_time:=$USE_SIM_TIME
<% end %>
