/**:
  ros__parameters:
    odometry_topic: "/odom"
    pose_topic: ""
    detections_topic: "/semantic_observations"
    corrected_localization_topic: "slam/corrected_localization"
    corrected_path_topic: "slam/corrected_path"
    map_frame: "drone0/map"
    odom_frame: "drone0/odom"
    robot_frame: "drone0/base_link"
    viz_main_markers_topic: "slam_viz/markers/main"
    viz_temp_markers_topic: "slam_viz/markers/temp"
    main_graph_odometry_distance_threshold: 0.5
    main_graph_odometry_distance_threshold_if_detections: 0.5
    main_graph_odometry_orientation_threshold: 2.0
    temp_graph_odometry_distance_threshold: 0.1
    temp_graph_odometry_orientation_threshold: 0.1
    odometry_is_relative: false
    generate_odom_map_transform: true
    earth_to_map:
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
    visualize_graphs: true
    map_odom_security_threshold: 5.0
    calculate_odom_covariance: true
    # Wall/plane observations carry no information about height, roll, or pitch
    restrict_map_odom_correction_to_xy_yaw: true
    map_odom_transform_alpha: 1.0
    # DETECTIONS
    generate_orientation_cov_by_distance: false
    distance_for_orientation_covariance_increment: 10.0
    detection_orientation_covariance_large_factor: 100.0
    detection_covariance_by_distance: false
    detection_covariance_by_distance2: false
    detection_covariance_factor: 10.0
    detection_orientation_covariance_factor: 10.0
    throttle_detections: true
    use_dual_graph: true
    # Huber delta applied to every graph edge (odometry + wall/aruco/gate observations).
    # Caps how much a single mismatched/outlier observation can pull the trajectory;
    # needs empirical tuning against real data (smaller = rejects outliers harder).
    robust_kernel_delta: 3.0
    force_object_type: "wall"
    # Line2D walls are vertical in the world: tilt them by the sensor's roll/pitch instead of
    # treating them as vertical in the sensor frame (the drone cruises at 3-6 deg of tilt).
    line_detections_gravity_aligned: true
    fixed_objects:
    #   gate_1:
    #     type: "aruco"
    #     pose: [4.0, 1.3, 1.13, 0.0]
    #   gate_2:
    #     type: "aruco"
    #     pose: [4.0, -1.34, 1.16, 0.0]
    #   gate_3:
    #     type: "aruco"
    #     pose: [-4.0, -1.29, 1.16, 0.0]
    #   gate_4:
    #     type: "aruco"
    #     pose: [-3.97, 1.28, 1.17, 0.0]
