# Real-flight overrides (launcher.sh -r; FAST-LIO + Livox Mid-360), on top of the sslam_tools package configs.

/converter:
  ros__parameters:
    # input format (real: custom_msg)
    input_type: "custom_msg"
    # packets per scan, ~100 Hz packets -> 10 Hz scan (10)
    accumulate_packets: 10

/detector_node:
  ros__parameters:
    # scan stamp shift onto the odometry time base (0.0; +0.032 was worse)
    stamp_offset_sec: 0.0
    # debug images, costs CPU (false)
    capture_inference_image: false

/local_fusion_node:
  ros__parameters:
    # debug image (false)
    publish_img_flag: false

/global_fusion_node:
  ros__parameters:
    # map frame (sim: drone0/map / real: map)
    map_frame: 'map'
    # debug image (false)
    publish_img_flag: false
    # debug image period if turned on (1.0)
    image_period_sec: 1.0
    # observation distance std output to graph optimization (sim: 2.0 / real: 5.0)
    obs_dist_std_cm: 5.0
    # observation distance std growth per m of range (sim: 0.5 / real: 0.0)
    obs_dist_std_per_m_cm: 0.0
    # observation angle std output to graph optimization (sim: 1.5 / real: 1.0)
    obs_angle_std_deg: 1.0
    # association distance gate (real: 20 / sim: 30)
    match_dist_thresh: 20.0
    # association angle gate (package: 5 / real, sim: 8)
    match_angle_thresh_deg: 8.0
    # association along-wall gap (real: 30 / sim: 10)
    overlap_thresh: 30.0
    # turn filter: skip frames above this yaw rate (real: 45 / sim: 20)
    max_yaw_rate_deg_s: 45.0
    # turn filter: keep skipping this long after a fast turn (0.5)
    yaw_rate_settle_sec: 0.5
    # ambiguity: drop an observation if 2nd-best cost < ratio * best, 0 disables (2.0)
    ambiguity_cost_ratio: 2.0

/odom_covariance_node:
  ros__parameters:
    input_topic: "/odom"
    output_topic: "/odom_cov"
    # covariance for position output to graph optimization, per keyframe (real: 0.01 / 41cm: 0.03 / 1m: 0.07 / 2m: 0.14)
    position_std_m: 0.01
    # covariance for attitude output to graph optimization, per keyframe (real: 0.0057 / 41cm: 0.2 / 1m: 0.5 / 2m: 1.0)
    attitude_std_deg: 0.0057
